# Nokoribi Agent M1-M6 bundle.
#
# This is a complete Cordis tree, not a layer over dsh-base. Rows are loaded in
# order; `inject` declarations decide activation. Keep row ids stable: the NixOS
# module overrides rows by id.

- insert:
      - id: timer
        name: "@deepseek-ai/cordis-plugin-timer"

      - id: llm
        name: "@deepseek-ai/dsh-llm"

      - id: llm-deepseek
        name: "@deepseek-ai/dsh-llm-deepseek-api-key"
        config:
            apiKeyEnv: DEEPSEEK_API_KEY

      - id: llm-retry
        name: "@deepseek-ai/dsh-llm-retry"

      - id: session
        name: "@deepseek-ai/dsh-session"

      - id: sessions
        name: "@deepseek-ai/dsh-session-persistence-jsonl"
        config:
            root: !!js dshHomePath('sessions')
            compression: none

      - id: session-projection
        name: "@deepseek-ai/dsh-session-projection"

      - id: session-query
        name: "@deepseek-ai/dsh-session-query-sqlite"
        config:
            # Exact reads (including subagent listChildren) need the service;
            # full-text search and its SQLite index are disabled for v1.
            path: ":memory:"
            openAt: never

      - id: session-title
        name: "@deepseek-ai/dsh-session-title"
        config:
            fallbackMaxWords: 5
            fallbackMaxBytes: 40
            maxTitleBytes: 80

      - id: session-checkpoint-policy
        name: "@deepseek-ai/dsh-session-checkpoint-policy"

      - id: token-meter
        name: "@deepseek-ai/dsh-token-meter"

      - id: compaction-basic
        name: "@deepseek-ai/dsh-compaction-basic"

      - id: compaction-pruner
        name: "@deepseek-ai/dsh-compaction-tool-result-pruner"

      - id: agent
        name: "@deepseek-ai/dsh-agent"

      - id: tools
        name: "@deepseek-ai/dsh-tools"

      - id: system-prompt
        name: "@deepseek-ai/dsh-system-prompt"
        config:
            includeHarnessIdentity: false
            includeRuntimeContext: false
            personaPrefix: ""

      - id: agent-instructions
        name: "@deepseek-ai/dsh-agent-instructions"
        config:
            maxBytes: 65536

      - id: time-context
        name: "@deepseek-ai/dsh-time-context"
        config:
            timeZone: !!js process.env.NOKORIBI_TIME_ZONE ?? Intl.DateTimeFormat().resolvedOptions().timeZone
            refreshIntervalMs: !!js Number(process.env.NOKORIBI_TIME_CONTEXT_REFRESH_MS ?? 60000)

      - id: working-directory
        name: "@deepseek-ai/dsh-working-directory"

      - id: commands
        name: "@deepseek-ai/dsh-commands"

      - id: filesystem
        name: "@deepseek-ai/dsh-fs-local"

      - id: fs-observation-policy
        name: "@deepseek-ai/dsh-fs-observation-policy"

      - id: tool-fs
        name: "@deepseek-ai/dsh-tool-fs"
        config:
            read: true
            readImage: false
            write: true
            edit: true

      - id: tool-fs-search
        name: "@deepseek-ai/dsh-tool-fs-search"
        config:
            sampleOverCapGlobResults: false

      - id: subprocess
        name: "@deepseek-ai/dsh-subprocess-local"

      - id: shell-env
        name: "@deepseek-ai/dsh-shell-env"

      - id: jobs
        name: "@deepseek-ai/dsh-jobs-local"

      - id: tool-jobs
        name: "@deepseek-ai/dsh-tool-jobs"

      - id: user-approval
        name: "@deepseek-ai/dsh-user-approval"
        config:
            policy: never

      - id: user-questions
        name: "@deepseek-ai/dsh-user-questions"

      - id: tool-ask-user
        name: "@deepseek-ai/dsh-tool-ask-user"

      - id: tool-todo
        name: "@deepseek-ai/dsh-tool-todo"
        config:
            allowParallelInProgress: true

      - id: tool-call-timeout-policy
        name: "@deepseek-ai/dsh-tool-call-timeout-policy"

      - id: spill
        name: "@deepseek-ai/dsh-spill-local"
        config:
            root: !!js dshHomePath('spill')

      - id: spill-policy
        name: "@deepseek-ai/dsh-spill-policy"

      - id: repeat-tool-reminder
        name: "@deepseek-ai/dsh-repeat-tool-reminder"

      - id: attachment-local
        name: "@deepseek-ai/dsh-attachment-local"

      - id: agent-loop
        name: "@deepseek-ai/dsh-agent-loop"
        config:
            agents: []

      # --- Storage, schedule and goal rows (M4/M5) -------------------------

      - id: storage
        name: "@deepseek-ai/dsh-storage"

      - id: storage-json
        name: "@deepseek-ai/dsh-storage-json"
        config:
            root: !!js dshHomePath('storage')

      - id: storage-domain
        name: "@deepseek-ai/dsh-storage-domain"
        config:
            backend: json

      - id: nokoribi-session-bridge
        name: "@nokoribi/agent-app/session-bridge"

      - id: schedule
        name: "@deepseek-ai/dsh-schedule"
        config:
            deliveryHistoryDays: 30
            deliveryHistoryRecords: 200

      - id: tool-schedule
        name: "@deepseek-ai/dsh-tool-schedule"

      - id: goal
        name: "@deepseek-ai/dsh-goal"

      - id: subagent
        name: "@deepseek-ai/dsh-subagent"
        config:
            maxDepth: 1
            maxActiveSubagents: !!js Number(process.env.NOKORIBI_MAX_ACTIVE_SUBAGENTS ?? 9007199254740991)

      - id: subagent-spawn
        name: "@deepseek-ai/dsh-subagent-spawn-in-process"
        config:
            providerName: spawn

      - id: tool-subagent
        name: "@deepseek-ai/dsh-tool-subagent"
        config:
            provider: spawn
            maxDepth: 1

      - id: tool-subagent-control
        name: "@deepseek-ai/dsh-tool-subagent-control"

      - id: tool-goal
        name: "@deepseek-ai/dsh-tool-goal"

      - id: goal-round-driver
        name: "@deepseek-ai/dsh-goal-round-driver"

      # --- Nokoribi rows ---------------------------------------------------

      - id: nokoribi-memory
        name: "@nokoribi/memory"
        config:
            root: !!js dshHomePath('memory')

      - id: nokoribi-prompt
        name: "@nokoribi/prompt"
        config:
            soulFile: !!js process.env.NOKORIBI_SOUL_FILE ?? ''
            templatesDir: !!js process.env.NOKORIBI_TEMPLATES_DIR ?? ''
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            seedGlobalAgents: true
            seedWorkspaceAgents: true

      - id: nokoribi-shell-router
        name: "@nokoribi/shell-bash"
        config:
            defaultHost: !!js process.env.NOKORIBI_DEFAULT_HOST ?? 'sandbox:default'

      - id: nokoribi-shell-host-local
        name: "@nokoribi/shell-host-local"
        config:
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            extraPackages: !!js (process.env.NOKORIBI_LOCAL_EXTRA_PATH ?? '').split(':').filter(Boolean)

      - id: nokoribi-shell-host-sandbox
        name: "@nokoribi/shell-host-sandbox"
        config:
            id: sandbox:default
            root: !!js dshHomePath('sandboxes')
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            baseEnvironment: !!js process.env.NOKORIBI_SANDBOX_BASE_ENV ?? ''
            shellHook: !!js process.env.NOKORIBI_SANDBOX_SHELL_HOOK ?? ''
            idleTtlMs: !!js Number(process.env.NOKORIBI_SANDBOX_TTL_MS ?? 1800000)
            sweepIntervalMs: !!js Number(process.env.NOKORIBI_SANDBOX_SWEEP_MS ?? 60000)
            allowRuntimePackages: !!js (process.env.NOKORIBI_SANDBOX_ALLOW_RUNTIME_PACKAGES ?? 'true') !== 'false'
            nixBinary: !!js process.env.NOKORIBI_SANDBOX_NIX ?? 'nix'
            nixTimeoutMs: !!js Number(process.env.NOKORIBI_SANDBOX_NIX_TIMEOUT_MS ?? 120000)
            noNewPrivilegesCommand: !!js process.env.NOKORIBI_SANDBOX_SETPRIV ?? ''

      - id: nokoribi-tool-bash-hosted
        name: "@nokoribi/shell-bash/tool"

      - id: permission-presets
        name: "@deepseek-ai/dsh-permission-presets"
        config:
            presets:
                danger-full-access:
                    sandbox: danger-full-access
                    approval: never
                    name: danger-full-access
                    description: Full host access; every tool call is reviewed by Auto review.
            defaultPreset: danger-full-access

      - id: nokoribi-reviewer
        name: "@nokoribi/reviewer"
        config:
            fast:
                provider: !!js process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
                model: !!js process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
                reasoningEffort: !!js process.env.NOKORIBI_REVIEW_FAST_REASONING_EFFORT ?? ''
            strong:
                provider: !!js process.env.NOKORIBI_REVIEW_STRONG_PROVIDER ?? process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
                model: !!js process.env.NOKORIBI_REVIEW_STRONG_MODEL ?? process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
                reasoningEffort: !!js process.env.NOKORIBI_REVIEW_STRONG_REASONING_EFFORT ?? ''
            timeoutMs: !!js Number(process.env.NOKORIBI_REVIEW_TIMEOUT_MS ?? 30000)

      - id: nokoribi-channel-core
        name: "@nokoribi/channel-core"
        config:
            allowedSenders: !!js (process.env.NOKORIBI_ALLOWED_SENDERS ?? 'local-user').split(',')
            allowedChats: !!js (process.env.NOKORIBI_ALLOWED_CHATS ?? 'local').split(',')
            defaultChatId: local
            trustedChannels: []
            defaultChannelId: local-test
            approvalTimeoutMs: !!js Number(process.env.NOKORIBI_APPROVAL_TIMEOUT_MS ?? 60000)
            questionTimeoutMs: !!js Number(process.env.NOKORIBI_QUESTION_TIMEOUT_MS ?? 300000)

      - id: nokoribi-channel-local-test
        name: "@nokoribi/channel-local-test"
        config:
            host: 127.0.0.1
            port: !!js Number(process.env.NOKORIBI_TEST_PORT ?? 8787)
            token: !!js process.env.NOKORIBI_TEST_TOKEN ?? ''
            senderId: local-user
            chatId: local
            longPollTimeoutMs: 25000

      - id: nokoribi-agent-app
        name: "@nokoribi/agent-app"
        config:
            provider: !!js process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            model: !!js process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            shutdownGraceMs: !!js Number(process.env.NOKORIBI_SHUTDOWN_GRACE_MS ?? 20000)
            version: !!js process.env.NOKORIBI_VERSION ?? '0.0.0-dev'
            goalProvider: !!js process.env.NOKORIBI_GOAL_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            goalModel: !!js process.env.NOKORIBI_GOAL_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            goalReasoningEffort: !!js process.env.NOKORIBI_GOAL_REASONING_EFFORT ?? ''
            goalModels: !!js (process.env.NOKORIBI_GOAL_MODELS ?? '').split(',').map((value) => value.trim()).filter(Boolean)
            goalDefaultMaxRounds: !!js Number(process.env.NOKORIBI_GOAL_DEFAULT_MAX_ROUNDS ?? 256)
            goalRecoveryTimeoutMs: !!js Number(process.env.NOKORIBI_GOAL_RECOVERY_TIMEOUT_MS ?? 30000)
            memoryProvider: !!js process.env.NOKORIBI_MEMORY_PROVIDER ?? process.env.NOKORIBI_GOAL_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            memoryModel: !!js process.env.NOKORIBI_MEMORY_MODEL ?? process.env.NOKORIBI_GOAL_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            memoryReasoningEffort: !!js process.env.NOKORIBI_MEMORY_REASONING_EFFORT ?? ''
            memoryCurator: !!js (process.env.NOKORIBI_MEMORY_CURATOR ?? 'true') !== 'false'
            memoryCuratorTimeoutMs: !!js Number(process.env.NOKORIBI_MEMORY_CURATOR_TIMEOUT_MS ?? 60000)
            reviewFastProvider: !!js process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            reviewFastModel: !!js process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            reviewFastReasoningEffort: !!js process.env.NOKORIBI_REVIEW_FAST_REASONING_EFFORT ?? ''
            reviewStrongProvider: !!js process.env.NOKORIBI_REVIEW_STRONG_PROVIDER ?? process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            reviewStrongModel: !!js process.env.NOKORIBI_REVIEW_STRONG_MODEL ?? process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            reviewStrongReasoningEffort: !!js process.env.NOKORIBI_REVIEW_STRONG_REASONING_EFFORT ?? ''
            reviewTimeoutMs: !!js Number(process.env.NOKORIBI_REVIEW_TIMEOUT_MS ?? 30000)
