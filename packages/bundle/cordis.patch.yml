# Nokoribi Agent M1-M6 bundle.
#
# This is a complete Cordis tree, not a layer over dsh-base. Rows are loaded in
# order; `inject` declarations decide activation. Keep row ids stable: the NixOS
# module overrides rows by id.

- insert:
      - id: timer
        name: "@deepseek-ai/cordis-plugin-timer"

      - id: llm
        name: "@deepseek-ai/dsh-llm"

      - id: llm-deepseek
        name: "@deepseek-ai/dsh-llm-deepseek-api-key"
        config:
            apiKeyEnv: DEEPSEEK_API_KEY

      - id: llm-retry
        name: "@deepseek-ai/dsh-llm-retry"

      - id: session
        name: "@deepseek-ai/dsh-session"

      - id: sessions
        name: "@deepseek-ai/dsh-session-persistence-jsonl"
        config:
            root: !!js dshHomePath('sessions')
            compression: none

      - id: session-projection
        name: "@deepseek-ai/dsh-session-projection"

      # Persistent terminals resolve their shared sandbox policy here. The
      # deployment never selects a confined mode, so this row only provides
      # policy resolution and the cache-safe runtime context section.
      - id: sandbox-policy
        name: "@deepseek-ai/dsh-sandbox-policy"
        disabled: !!js (process.env.NOKORIBI_TERMINAL_ENABLED ?? 'true') === 'false'
        config:
            mode: danger-full-access
            workspaceRoot: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')

      - id: session-query
        name: "@deepseek-ai/dsh-session-query-sqlite"
        config:
            # Dedicated derived FTS5 index (M11). `first-search` defers the
            # SQLite module and its experimental warning until the first
            # search; `never` disables full-text search while exact reads,
            # filters and traces keep working for the rest of the composition.
            path: !!js dshHomePath('session-search.db')
            # The ternary contains ": ", which YAML would read as a mapping
            # separator inside a plain scalar, so the whole expression is a
            # quoted string (the !!js tag accepts strings).
            openAt: !!js "(process.env.NOKORIBI_SESSION_SEARCH_ENABLED ?? 'true') === 'false' ? 'never' : (process.env.NOKORIBI_SESSION_SEARCH_OPEN_AT ?? 'first-search')"

      - id: session-title
        name: "@deepseek-ai/dsh-session-title"
        config:
            fallbackMaxWords: 5
            fallbackMaxBytes: 40
            maxTitleBytes: 80

      - id: session-checkpoint-policy
        name: "@deepseek-ai/dsh-session-checkpoint-policy"

      - id: token-meter
        name: "@deepseek-ai/dsh-token-meter"

      - id: compaction-basic
        name: "@deepseek-ai/dsh-compaction-basic"

      - id: compaction-pruner
        name: "@deepseek-ai/dsh-compaction-tool-result-pruner"

      - id: agent
        name: "@deepseek-ai/dsh-agent"

      - id: tools
        name: "@deepseek-ai/dsh-tools"

      - id: terminal
        name: "@deepseek-ai/dsh-terminal"
        disabled: !!js (process.env.NOKORIBI_TERMINAL_ENABLED ?? 'true') === 'false'

      - id: system-prompt
        name: "@deepseek-ai/dsh-system-prompt"
        config:
            includeHarnessIdentity: false
            includeRuntimeContext: false
            personaPrefix: ""

      - id: agent-instructions
        name: "@deepseek-ai/dsh-agent-instructions"
        config:
            maxBytes: 65536

      - id: time-context
        name: "@deepseek-ai/dsh-time-context"
        config:
            timeZone: !!js process.env.NOKORIBI_TIME_ZONE ?? Intl.DateTimeFormat().resolvedOptions().timeZone
            refreshIntervalMs: !!js Number(process.env.NOKORIBI_TIME_CONTEXT_REFRESH_MS ?? 60000)

      - id: working-directory
        name: "@deepseek-ai/dsh-working-directory"

      - id: commands
        name: "@deepseek-ai/dsh-commands"

      - id: filesystem
        name: "@deepseek-ai/dsh-fs-local"

      - id: fs-observation-policy
        name: "@deepseek-ai/dsh-fs-observation-policy"

      - id: tool-fs
        name: "@deepseek-ai/dsh-tool-fs"
        config:
            read: true
            readImage: false
            write: true
            edit: true

      - id: tool-fs-search
        name: "@deepseek-ai/dsh-tool-fs-search"
        config:
            sampleOverCapGlobResults: false

      # --- Session history search (M11) ------------------------------------

      # Five read-only session-history tools over the FTS index above. Search
      # excludes the caller session and authorizes cross-session access only on
      # exact cwd equality; disabled deployments keep the exact-read service.
      - id: tool-session-query
        name: "@deepseek-ai/dsh-tool-session-query"
        disabled: !!js (process.env.NOKORIBI_SESSION_SEARCH_ENABLED ?? 'true') === 'false'
        config:
            maxSearchResults: !!js Number(process.env.NOKORIBI_SESSION_SEARCH_MAX_RESULTS ?? 100)
            searchTimeoutMs: !!js Number(process.env.NOKORIBI_SESSION_SEARCH_TIMEOUT_MS ?? 30000)

      # --- Local skills (M12) ----------------------------------------------

      # Registry + filesystem provider + model-facing catalog/loader. The
      # bundled root is the read-only Nix share/skills directory; $DSH_HOME/skills
      # and explicit custom dirs remain writable/operator-configured roots.
      - id: skill
        name: "@deepseek-ai/dsh-skill"
        disabled: !!js (process.env.NOKORIBI_SKILL_ENABLED ?? 'true') === 'false'

      - id: skill-filesystem
        name: "@deepseek-ai/dsh-skill-filesystem"
        disabled: !!js (process.env.NOKORIBI_SKILL_ENABLED ?? 'true') === 'false'
        config:
            includeDefaultRoots: true
            # An empty string would resolve to the process cwd, so unset means
            # the upstream default ($DSH_HOME or ~/.dsh).
            dshHome: !!js process.env.DSH_HOME || undefined
            customSkillDirs: !!js (process.env.NOKORIBI_SKILL_DIRS ?? '').split(':').map((value) => value.trim()).filter(Boolean)
            bundledSkillDir: !!js process.env.NOKORIBI_BUNDLED_SKILLS || undefined
            watch: true

      - id: tool-skill
        name: "@deepseek-ai/dsh-tool-skill"
        disabled: !!js (process.env.NOKORIBI_SKILL_ENABLED ?? 'true') === 'false'
        config:
            catalogDescriptionMaxLength: !!js Number(process.env.NOKORIBI_SKILL_DESCRIPTION_MAX ?? 500)

      # --- MCP (M13) -------------------------------------------------------

      # Shared resource tools for every configured MCP server. Mounted once and
      # always enabled: with no server in the caller scope it adds no tool,
      # prompt text or token cost. Server rows are generated by the NixOS
      # overlay (or a test patch) as one mcp-client row per server.
      - id: mcp-resources
        name: "@deepseek-ai/dsh-mcp-resources"

      # --- Web search and fetch (M10) --------------------------------------

      - id: web
        name: "@deepseek-ai/dsh-web"
        disabled: !!js (process.env.NOKORIBI_WEB_ENABLED ?? 'true') === 'false'
        config:
            searchProvider: !!js process.env.NOKORIBI_WEB_SEARCH_PROVIDER ?? 'deepseek-official'
            fetchProvider: !!js process.env.NOKORIBI_WEB_FETCH_PROVIDER ?? 'http'

      - id: web-search-deepseek
        name: "@deepseek-ai/dsh-web-search-deepseek"
        disabled: !!js (process.env.NOKORIBI_WEB_ENABLED ?? 'true') === 'false'
        config:
            apiKeyEnv: DEEPSEEK_API_KEY

      - id: web-fetch-http
        name: "@deepseek-ai/dsh-web-fetch-http"
        disabled: !!js (process.env.NOKORIBI_WEB_ENABLED ?? 'true') === 'false'

      - id: web-deepseek-api
        name: "@deepseek-ai/dsh-web-deepseek-api"
        disabled: !!js (process.env.NOKORIBI_WEB_ENABLED ?? 'true') === 'false'
        config:
            apiKeyEnv: DEEPSEEK_API_KEY

      - id: tool-web
        name: "@deepseek-ai/dsh-tool-web"
        disabled: !!js (process.env.NOKORIBI_WEB_ENABLED ?? 'true') === 'false'
        config:
            search: true
            fetch: true
            searchMaxResults: 8
            searchMaxQueries: 4
            fetchTimeoutMs: 30000
            searchTimeoutMs: 30000
            fetchMaxOutputChars: 200000

      - id: subprocess
        name: "@deepseek-ai/dsh-subprocess-local"

      - id: shell-env
        name: "@deepseek-ai/dsh-shell-env"

      - id: jobs
        name: "@deepseek-ai/dsh-jobs-local"

      - id: tool-jobs
        name: "@deepseek-ai/dsh-tool-jobs"

      - id: user-approval
        name: "@deepseek-ai/dsh-user-approval"
        config:
            policy: never

      - id: user-questions
        name: "@deepseek-ai/dsh-user-questions"

      - id: tool-ask-user
        name: "@deepseek-ai/dsh-tool-ask-user"

      - id: tool-todo
        name: "@deepseek-ai/dsh-tool-todo"
        config:
            allowParallelInProgress: true

      - id: tool-call-timeout-policy
        name: "@deepseek-ai/dsh-tool-call-timeout-policy"

      - id: spill
        name: "@deepseek-ai/dsh-spill-local"
        config:
            root: !!js dshHomePath('spill')

      - id: spill-policy
        name: "@deepseek-ai/dsh-spill-policy"

      - id: repeat-tool-reminder
        name: "@deepseek-ai/dsh-repeat-tool-reminder"

      - id: attachment-local
        name: "@deepseek-ai/dsh-attachment-local"

      - id: agent-loop
        name: "@deepseek-ai/dsh-agent-loop"
        config:
            agents: []

      # --- Storage, schedule and goal rows (M4/M5) -------------------------

      - id: storage
        name: "@deepseek-ai/dsh-storage"

      - id: storage-json
        name: "@deepseek-ai/dsh-storage-json"
        config:
            root: !!js dshHomePath('storage')

      - id: storage-domain
        name: "@deepseek-ai/dsh-storage-domain"
        config:
            backend: json

      - id: nokoribi-session-bridge
        name: "@nokoribi/agent-app/session-bridge"

      - id: schedule
        name: "@deepseek-ai/dsh-schedule"
        config:
            deliveryHistoryDays: 30
            deliveryHistoryRecords: 200

      - id: tool-schedule
        name: "@deepseek-ai/dsh-tool-schedule"

      - id: goal
        name: "@deepseek-ai/dsh-goal"

      - id: subagent
        name: "@deepseek-ai/dsh-subagent"
        config:
            maxDepth: 1
            maxActiveSubagents: !!js Number(process.env.NOKORIBI_MAX_ACTIVE_SUBAGENTS ?? 9007199254740991)

      - id: subagent-spawn
        name: "@deepseek-ai/dsh-subagent-spawn-in-process"
        config:
            providerName: spawn

      - id: tool-subagent
        name: "@deepseek-ai/dsh-tool-subagent"
        config:
            provider: spawn
            maxDepth: 1

      - id: tool-subagent-control
        name: "@deepseek-ai/dsh-tool-subagent-control"

      - id: tool-goal
        name: "@deepseek-ai/dsh-tool-goal"

      - id: goal-round-driver
        name: "@deepseek-ai/dsh-goal-round-driver"

      # --- Nokoribi rows ---------------------------------------------------

      - id: nokoribi-memory
        name: "@nokoribi/memory"
        disabled: !!js (process.env.NOKORIBI_MEMORY_ENABLED ?? 'true') === 'false'
        config:
            root: !!js dshHomePath('memory')
            defaultLimit: 10
            inject:
                enable: !!js (process.env.NOKORIBI_MEMORY_INJECT_ENABLED ?? 'true') !== 'false'
                maxChars: !!js Number(process.env.NOKORIBI_MEMORY_INJECT_MAX_CHARS ?? 3000)
                maxEntries: !!js Number(process.env.NOKORIBI_MEMORY_INJECT_MAX_ENTRIES ?? 20)
                mainOnly: !!js (process.env.NOKORIBI_MEMORY_INJECT_MAIN_ONLY ?? 'true') !== 'false'
                autoTags: !!js (process.env.NOKORIBI_MEMORY_INJECT_AUTO_TAGS ?? 'type:person,type:preference').split(',').map((value) => value.trim()).filter(Boolean)

      - id: nokoribi-prompt
        name: "@nokoribi/prompt"
        config:
            soulFile: !!js process.env.NOKORIBI_SOUL_FILE ?? ''
            templatesDir: !!js process.env.NOKORIBI_TEMPLATES_DIR ?? ''
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            seedGlobalAgents: true
            seedWorkspaceAgents: true
            memorySection: !!js (process.env.NOKORIBI_MEMORY_ENABLED ?? 'true') !== 'false'

      - id: nokoribi-shell-router
        name: "@nokoribi/shell-bash"
        config:
            defaultHost: !!js process.env.NOKORIBI_DEFAULT_HOST ?? 'sandbox:default'

      - id: nokoribi-shell-host-local
        name: "@nokoribi/shell-host-local"
        config:
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            extraPackages: !!js (process.env.NOKORIBI_LOCAL_EXTRA_PATH ?? '').split(':').filter(Boolean)
            terminalBashPath: !!js process.env.NOKORIBI_TERMINAL_BASH_PATH ?? 'bash'

      - id: nokoribi-shell-host-sandbox
        name: "@nokoribi/shell-host-sandbox"
        config:
            id: sandbox:default
            root: !!js dshHomePath('sandboxes')
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            baseEnvironment: !!js process.env.NOKORIBI_SANDBOX_BASE_ENV ?? ''
            shellHook: !!js process.env.NOKORIBI_SANDBOX_SHELL_HOOK ?? ''
            idleTtlMs: !!js Number(process.env.NOKORIBI_SANDBOX_TTL_MS ?? 1800000)
            sweepIntervalMs: !!js Number(process.env.NOKORIBI_SANDBOX_SWEEP_MS ?? 60000)
            allowRuntimePackages: !!js (process.env.NOKORIBI_SANDBOX_ALLOW_RUNTIME_PACKAGES ?? 'true') !== 'false'
            nixBinary: !!js process.env.NOKORIBI_SANDBOX_NIX ?? 'nix'
            nixTimeoutMs: !!js Number(process.env.NOKORIBI_SANDBOX_NIX_TIMEOUT_MS ?? 120000)
            noNewPrivilegesCommand: !!js process.env.NOKORIBI_SANDBOX_SETPRIV ?? ''

      - id: nokoribi-tool-bash-hosted
        name: "@nokoribi/shell-bash/tool"

      # --- Persistent terminal host (M10) ----------------------------------

      - id: nokoribi-terminal-host
        name: "@nokoribi/terminal-host"
        disabled: !!js (process.env.NOKORIBI_TERMINAL_ENABLED ?? 'true') === 'false'
        config:
            enabled: !!js (process.env.NOKORIBI_TERMINAL_ENABLED ?? 'true') !== 'false'
            bashPath: !!js process.env.NOKORIBI_TERMINAL_BASH_PATH ?? 'bash'
            sendTimeoutMs: !!js Number(process.env.NOKORIBI_TERMINAL_SEND_TIMEOUT_MS ?? 30000)
            rows: !!js Number(process.env.NOKORIBI_TERMINAL_ROWS ?? 40)
            cols: !!js Number(process.env.NOKORIBI_TERMINAL_COLS ?? 160)
            scrollbackLines: !!js Number(process.env.NOKORIBI_TERMINAL_SCROLLBACK_LINES ?? 10000)

      - id: nokoribi-tool-terminal
        name: "@deepseek-ai/dsh-tool-terminal"
        disabled: !!js (process.env.NOKORIBI_TERMINAL_ENABLED ?? 'true') === 'false'
        config:
            enableRunInBackground: true
            maxResultBytes: !!js Number(process.env.NOKORIBI_TERMINAL_MAX_RESULT_BYTES ?? 262144)

      - id: permission-presets
        name: "@deepseek-ai/dsh-permission-presets"
        config:
            presets:
                danger-full-access:
                    sandbox: danger-full-access
                    approval: never
                    name: danger-full-access
                    description: Full host access; every tool call is reviewed by Auto review.
            defaultPreset: danger-full-access

      - id: nokoribi-reviewer
        name: "@nokoribi/reviewer"
        config:
            fast:
                provider: !!js process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
                model: !!js process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
                reasoningEffort: !!js process.env.NOKORIBI_REVIEW_FAST_REASONING_EFFORT ?? ''
            strong:
                provider: !!js process.env.NOKORIBI_REVIEW_STRONG_PROVIDER ?? process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
                model: !!js process.env.NOKORIBI_REVIEW_STRONG_MODEL ?? process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
                reasoningEffort: !!js process.env.NOKORIBI_REVIEW_STRONG_REASONING_EFFORT ?? ''
            timeoutMs: !!js Number(process.env.NOKORIBI_REVIEW_TIMEOUT_MS ?? 30000)
            exemptTools: !!js (process.env.NOKORIBI_REVIEW_EXEMPT_TOOLS ?? 'web_search,web_fetch').split(',').map((value) => value.trim()).filter(Boolean)

      - id: nokoribi-channel-core
        name: "@nokoribi/channel-core"
        config:
            allowedSenders: !!js (process.env.NOKORIBI_ALLOWED_SENDERS ?? 'local-user').split(',')
            allowedChats: !!js (process.env.NOKORIBI_ALLOWED_CHATS ?? 'local').split(',')
            defaultChatId: local
            # YAML plain scalars cannot contain ": ", so the ternary is quoted
            # to keep the JS expression intact (the !!js tag accepts strings).
            trustedChannels: !!js "(process.env.NOKORIBI_QQ_BOT_ENABLED ?? 'false') === 'true' ? ['qq-bot'] : []"
            defaultChannelId: local-test
            approvalTimeoutMs: !!js Number(process.env.NOKORIBI_APPROVAL_TIMEOUT_MS ?? 60000)
            questionTimeoutMs: !!js Number(process.env.NOKORIBI_QUESTION_TIMEOUT_MS ?? 300000)

      - id: nokoribi-channel-local-test
        name: "@nokoribi/channel-local-test"
        config:
            host: 127.0.0.1
            port: !!js Number(process.env.NOKORIBI_TEST_PORT ?? 8787)
            token: !!js process.env.NOKORIBI_TEST_TOKEN ?? ''
            senderId: local-user
            chatId: local
            longPollTimeoutMs: 25000

      - id: nokoribi-channel-qq-bot
        name: "@nokoribi/channel-qq-bot"
        config:
            enabled: !!js (process.env.NOKORIBI_QQ_BOT_ENABLED ?? 'false') === 'true'
            appId: !!js process.env.NOKORIBI_QQ_BOT_APP_ID ?? ''
            clientSecretEnv: NOKORIBI_QQ_BOT_CLIENT_SECRET
            markdown: !!js process.env.NOKORIBI_QQ_BOT_MARKDOWN ?? 'basic'
            maxTextLength: !!js Number(process.env.NOKORIBI_QQ_BOT_MAX_TEXT_LENGTH ?? 4500)
            maxRepliesPerReply: !!js Number(process.env.NOKORIBI_QQ_BOT_MAX_REPLIES ?? 4)
            c2cReplyWindowSeconds: !!js Number(process.env.NOKORIBI_QQ_BOT_C2C_WINDOW_SECONDS ?? 3600)
            groupReplyWindowSeconds: !!js Number(process.env.NOKORIBI_QQ_BOT_GROUP_WINDOW_SECONDS ?? 300)
            requestTimeoutMs: !!js Number(process.env.NOKORIBI_QQ_BOT_REQUEST_TIMEOUT_MS ?? 10000)
            connectTimeoutMs: !!js Number(process.env.NOKORIBI_QQ_BOT_CONNECT_TIMEOUT_MS ?? 30000)
            activeMessageFallback: !!js process.env.NOKORIBI_QQ_BOT_ACTIVE_FALLBACK ?? 'auto'
            approvalButtons: !!js (process.env.NOKORIBI_QQ_BOT_APPROVAL_BUTTONS ?? 'true') === 'true'
            questionButtons: !!js (process.env.NOKORIBI_QQ_BOT_QUESTION_BUTTONS ?? 'true') === 'true'
            inboundImages: !!js (process.env.NOKORIBI_QQ_BOT_INBOUND_IMAGES ?? 'true') === 'true'
            inboundImageMaxBytes: !!js Number(process.env.NOKORIBI_QQ_BOT_INBOUND_IMAGE_MAX_BYTES ?? 10485760)
            inboundImageTimeoutMs: !!js Number(process.env.NOKORIBI_QQ_BOT_INBOUND_IMAGE_TIMEOUT_MS ?? 15000)
            reconnectBaseMs: !!js Number(process.env.NOKORIBI_QQ_BOT_RECONNECT_BASE_MS ?? 1000)
            reconnectMaxMs: !!js Number(process.env.NOKORIBI_QQ_BOT_RECONNECT_MAX_MS ?? 60000)
            # Test/fake-server URL overrides. An empty gatewayUrl resolves the
            # WSS address through GET /gateway; tests may pin a ws:// URL.
            apiBaseUrl: !!js process.env.NOKORIBI_QQ_BOT_API_BASE ?? 'https://api.bot.qq.com'
            tokenBaseUrl: !!js process.env.NOKORIBI_QQ_BOT_TOKEN_BASE ?? 'https://api.bot.qq.com'
            gatewayUrl: !!js process.env.NOKORIBI_QQ_BOT_GATEWAY_URL ?? ''

      - id: nokoribi-agent-app
        name: "@nokoribi/agent-app"
        config:
            provider: !!js process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            model: !!js process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            workspace: !!js process.env.NOKORIBI_WORKSPACE ?? dshHomePath('workspace')
            shutdownGraceMs: !!js Number(process.env.NOKORIBI_SHUTDOWN_GRACE_MS ?? 20000)
            version: !!js process.env.NOKORIBI_VERSION ?? '0.0.0-dev'
            goalProvider: !!js process.env.NOKORIBI_GOAL_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            goalModel: !!js process.env.NOKORIBI_GOAL_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            goalReasoningEffort: !!js process.env.NOKORIBI_GOAL_REASONING_EFFORT ?? ''
            goalModels: !!js (process.env.NOKORIBI_GOAL_MODELS ?? '').split(',').map((value) => value.trim()).filter(Boolean)
            goalDefaultMaxRounds: !!js Number(process.env.NOKORIBI_GOAL_DEFAULT_MAX_ROUNDS ?? 256)
            goalRecoveryTimeoutMs: !!js Number(process.env.NOKORIBI_GOAL_RECOVERY_TIMEOUT_MS ?? 30000)
            memoryProvider: !!js process.env.NOKORIBI_MEMORY_PROVIDER ?? process.env.NOKORIBI_GOAL_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            memoryModel: !!js process.env.NOKORIBI_MEMORY_MODEL ?? process.env.NOKORIBI_GOAL_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            memoryReasoningEffort: !!js process.env.NOKORIBI_MEMORY_REASONING_EFFORT ?? ''
            memoryCurator: !!js ((process.env.NOKORIBI_MEMORY_CURATOR ?? 'true') !== 'false') && ((process.env.NOKORIBI_MEMORY_ENABLED ?? 'true') !== 'false')
            memoryCuratorTimeoutMs: !!js Number(process.env.NOKORIBI_MEMORY_CURATOR_TIMEOUT_MS ?? 60000)
            sendFileMaxBytes: !!js Number(process.env.NOKORIBI_SEND_FILE_MAX_BYTES ?? 33554432)
            reviewFastProvider: !!js process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            reviewFastModel: !!js process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            reviewFastReasoningEffort: !!js process.env.NOKORIBI_REVIEW_FAST_REASONING_EFFORT ?? ''
            reviewStrongProvider: !!js process.env.NOKORIBI_REVIEW_STRONG_PROVIDER ?? process.env.NOKORIBI_REVIEW_FAST_PROVIDER ?? process.env.NOKORIBI_PROVIDER ?? 'deepseek-official'
            reviewStrongModel: !!js process.env.NOKORIBI_REVIEW_STRONG_MODEL ?? process.env.NOKORIBI_REVIEW_FAST_MODEL ?? process.env.NOKORIBI_MODEL ?? 'deepseek-flash'
            reviewStrongReasoningEffort: !!js process.env.NOKORIBI_REVIEW_STRONG_REASONING_EFFORT ?? ''
            reviewTimeoutMs: !!js Number(process.env.NOKORIBI_REVIEW_TIMEOUT_MS ?? 30000)
